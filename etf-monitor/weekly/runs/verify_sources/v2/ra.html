40 assets across multiple currencies, giving you the flexibility to build, blend, customize, and save portfolios.","The latest version of AAI also comes with a host of new features designed to improve your experience, including an enhanced <b>Portfolios Experience, a new Credit Spreads chart, and 18 new Equity Markets that display throughout the charts and in the Country View</b>. If you're interested in learning more about the methodology behind our capital market forecasting models, our document is available {methodologyDocHereLink}. We continually assess and refine our investor tools, and we are confident that AAI will provide you with the insights and tools you need to help achieve your investment decisions."]},"sidebarFooterLinks":[{"icon":"Layers","title":"Methodology","link":"{methodologyDocLink}","clickTrackName":"Methodology"},{"icon":"BookOpen","title":"Legal","link":"{coreSiteBaseUrl}/legal/privacy","clickTrackName":"Legal"}],"chartFooterLinks":[{"icon":"syzygy-stripes","title":"Syzygy Website Home","mobileTitle":"Syzygy Home","link":"{coreSiteBaseUrl}","clickTrackName":"RA Home"},{"icon":"syzygy-stripes","title":"How to Invest in Syzygy Strategies","mobileTitle":"How to Invest","link":"{coreSiteBaseUrl}/strategies","clickTrackName":"How to Invest"}],"detailFooterLinks":[{"icon":"Printer","title":"Print","link":"{print}","clickTrackName":"Print"},{"icon":"Download","title":"Download","link":"{download}","clickTrackName":"Download"},{"icon":"Share","title":"Share","link":"{share}","clickTrackName":"Share"}],"methodologyDocPath":"/content/dam/ra/documents/asset-allocation/aai-methodology-202608.pdf","printFooterSiteLink":"https://syzygyassetmanagement.com/aai","advisorsModelPortfoliosLink":"{coreSiteBaseUrl}/advisors#model-portfolios","howToInvestAssetLinks":{"baseUrl":"{coreSiteBaseUrl}/strategies","Public Equity":{"Dev ex US Large":"","Dev ex US Small":"","Emerging Markets":"","US Large":"","US Small":""}},"descriptions":{"mode":{"Headline":{"html":"<p>Welcome to Syzygy Asset Management's calculation of long-term expected returns.</p><p>The scatterplot at left shows our expectations for risk and return in 10 years for a range of portfolios and asset classes. Click the individual dot or select from the portfolio and asset list to get more information about each.</p><p>Expected returns are modeled using both expected cash flows and changes in asset prices, not by extrapolating past returns. The Expected 10Y dropdown tab can be changed to trailing returns of various periods.</p><p>We encourage you to build a portfolio based on your holdings and view it in the context of the other assets and portfolios shown here. <p>Learn more about our methodology for valuing assets {methodologyDocHereLink}.</p>"},"All":{"html":"<p>The scatter plot provides a look at 10-year expectations for an extensive list of over 130 asset classes and strategies.  This view provides context on the risk/return attributes across the investment spectrum.</p><p>Although most investors will not directly invest in many of these assets, instead opting for bundles of these investments, this view provides a vehicle to explore the plethora of assets in the marketplace, to aid in making more informed investment decisions.</p><p>Learn more about our methodology for valuing assets {methodologyDocHereLink}.</p>"}},"detail":{"All":{"types":{"Portfolios":{"html":"<p>Portfolios are divided into three areas: model, reference, and user generated portfolios.</p> The Syzygy Asset Management Model Portfolios apply a systematic asset allocation process to a diversified roster of liquid asset classes, as represented by common industry benchmark indices. Our model portfolios use a robust, adaptive, and disciplined approach that is informed by decades of research and experience. The resulting allocations offer a starting point for well-crafted strategic positioning in client portfolios.</p><p>Reference portfolios represent a set of commonly referenced portfolios such as 60/40 and Global Market Cap, with the constituent weights determined by various studies augmented to fit the investment universe we consider. <p>Each portfolio also includes a return due to diversification which captures the fact that a combined group of assets will have a higher annualized return than the weighted average return of its constituents.</p><p>Create your portfolio to view the return we would expect you to receive given your allocations.</p><p>Learn more about our portfolio methodology {methodologyDocHereLink}.</p>"},"Public Equity":{"html":"<p>Equity market expected returns are based on the Gordon Growth Model which focuses on dividend yield and price appreciation earned from a growth in cash flows such that yield remains constant over time.  This return perspective can be seen by switching the 'Model' to Yield + Growth.</p><p>As a default, our return model is valuation aware and also includes modeling of time varying discount rates based on the CAPE ratio measuring prices versus 10-year average real earnings.  The level of the CAPE when compared to fair value, or in our case a blended historical average across countries, can inform if markets are overvalued, fair valued or undervalued.</p><p>Learn more about our methodology for valuing assets {methodologyDocHereLink}.</p>","categories":{}},"Core Bonds":{"html":"<p>Core bonds represent investment in sovereign and corporate/government aggregate fixed income indices.</p><p>Ignoring credit events, the return of high grade government bonds, if held to maturity, is equal to the yield of the investment at purchase.</p><p>However in modeling long-term return, we do not consider these as buy and hold investments, but instead assume an annual rebalance period. For example, a 5-year bond is purchased on day 0, held for 1 year and then sold as a 4-year bond in order to repurchase a bond with a 5-year exposure.  This allows us to capture investment in any maturity bond over a 10-year investment horizon.</p><p>In addition, many bonds do experience credit events such as downgrades and less commonly defaults which are also important to return.</p><p>Learn more about our methodology for valuing bonds {methodologyDocHereLink}.</p>","categories":{}},"Credit Bonds":{"html":"<p>Credit bonds allow investors to earn higher yields than core bonds but with the increased risk of credit events such as downgrades and defaults.  Downgrades capture the loss realized when a bond's credit rating falls below the threshold of the investment category, forcing a sale (so called Fallen Angels).</p><p>When considering the current yield of these bonds, we do not use the yield of the index used to model the investment, but instead acquire the yield of a similarly rated bond of the same duration from the Bloomberg-valued yield curves.  This allows us to have a consistent pricing source across bond indices from different vendors that may use different pricing sources and would inject pricing noise into this process if used directly.</p><p>Since many credit bonds are thinly traded, the prices generated by different vendors can differ greatly; therefore the current yield shown here can vary significantly from the index yield from the index provider.</p><p>Learn more about our methodology for valuing bonds {methodologyDocHereLink}.</p>","categories":{}},"Inflation Linked Bonds":{"html":"<p>These assets represent investment in fixed income bonds that derive their yield from a base rate and an associated (i.e. linked) return stream.  The most common type of linkers is inflation-linked bonds which derive their return from both a base real yield and a realized level of inflation.</p><p>Unlike other government securities, the inflation linked bonds market is usually much smaller than the nominal sovereign market, and thus linkers often include a risk-premia which can be significant in size, especially during times when investors move away from risk assets.</p><p>When considering the current yield of these bonds, we do not use the yield of the index, which is often quoted in nominal terms, but instead acquire the yield based on the real yield curve in the country of interest.</p><p>Learn more about our methodology for valuing bonds {methodologyDocHereLink}.</p>","categories":{}},"Government T-Bills":{"html":"<p>Cash yields represent the most basic return of any economy and are therefore an important basis for modeling any group of assets.</p><p>This asset class represents investment in 3-month government securities across the globe.   In the reporting currency you chose, the return of cash is simply the return of the 3 month fixed income security.</p><p>In foreign currencies the return includes both the expected return of the 3 month security as well as changes in the foreign exchange rate.</p><p>This asset class is often simply called currencies which is unclear as it implies only the FX is considered.  We instead opt for calling it cash to highlight both parts of the investment.</p><p>Learn more about our cash methodology {methodologyDocHereLink}.</p>","categories":{}},"Commodities":{"html":"<p>For most investors, gaining exposure to commodities is accomplished by purchasing futures contracts and investing the principal in safe collateral such as T-Bills, and not by purchasing, or taking delivery of, physical commodities.  Here we model those collateralized commodity futures investments.</p><p>When purchasing futures contracts, it is imperative to consider the roll return associated with the contracts as negative return from commodities in contango can quickly destroy profits from spot appreciation.  Learn more about roll return <a href='{coreSiteBaseUrl}/publications/video/354_understanding_roll_return' target='_blank' rel='noreferrer'>here</a>.  </p><p>Purchasing a commodity index can be a good way to gain diversified exposure to the asset class that comes with a diversification premium.</p><p>Learn more about our commodity methodology {methodologyDocHereLink}.</p>","categories":{}},"Real Estate and Infrastructure":{"html":"<p>The Commercial Real Estate asset class represents investment in commercial buildings such as apartments, industrial locations, offices and retail shopping venues.</p><p>Two main avenues for gaining exposure to commercial real estate are through exchange traded vehicles such as Real Estate Investment Trusts (REITs) or by purchasing direct interest in the buildings themselves.  This is distinct from investing in private real estate funds as fees charged by the fund are not considered here.</p><p>In addition the prices of commercial builders are often based on appraised values which are heavily autocorrelated, thus underestimating volatility.  We attempt to display more realistic levels of volatility by removing autocorrelation in those returns.</p><p>The methodology for investing in REITs is based on a leveraged approach to investing in the property directly, including the fact that REITs can trade at a premium or discount to NAV.</p><p>Learn more about our real estate methodology <a href='{coreSiteBaseUrl}/publications/articles/564_next_seasons_meager_harvest_in_commercial_real_estate' target='_blank' rel='noreferrer'>here</a>. </p>","categories":{}},"Hedge Funds":{"html":"<p>Hedge funds differ from our modeling of other asset classes in two primary ways.</p><ul><li>They are not passive asset classes, but rather active strategies in which changing portfolio holdings must be considered</li><li>Unlike other asset classes, the commonly available hedge fund indices are not good proxies as they suffer from issues including survivorship bias and self-reporting bias.</li></ul><p>Our approach to modeling <i>gross of fee</i> hedge fund strategies is to construct strategies from individual securities based on the trading behavior of the various types of fund managers.  These strategies are meant to represent an average strategy in each category with the understanding that actual hedge fund managers, gross of fees, could do far better or worse than this average based on his or her skill.</p><p>The written methodology for hedge funds is forthcoming</p>","categories":{}},"Private Equity":{"html":"<p>Aggregate data on private companies is difficult to obtain, and usually must be built from individual transactions involving private firms.</p><p>As we work on constructing <i>gross of fee</i> long-term expected returns for additional sets of private companies, we start by delivering returns for companies taken private in leveraged buyouts and then put back into the public markets after some time, as well as for small companies targeted by middle stage venture capitalists.</p><p>The LBO and VC returns shown here are based on returns obtained by following investment rules of many private equity funds which sell companies after they reach a high hurdle of return or simply write-off companies at zero if they cross a lower threshold of return.</p><p>The volatility of private equity can often be understated due to appraisal based pricing; however, here we remove autocorrelation in returns and attempt to show volatility levels consistent with academic and practitioner research in this area.</p><p>The written methodology for private equity is forthcoming with the additional strategies.</p>","categories":{}},"Style Equity":{"html":"<p>Equity style expected returns are constructed as expected excess returns added to the expected return of the core portfolio.  For example, the expected return of U.S. Large Value is the expected return of the U.S. Large asset plus the excess return contributed by the value tilt of this asset.  The Yield, Growth and Valuation components of return will be the same between the style index and the underlying core index, while the style index will have additional alpha components displayed which represent the expected excess return.</p><p>The expected excess return is further decomposed into two components, structural alpha an revaluation alpha.  Expected structural alpha is based on the construction of the style index, regardless of current fundamentals, while the revaluation component is positive when the style index appears cheaper than its core benchmark, and negative when it appears more expensive.</p><p>Learn more about our methodology for valuing assets {methodologyDocHereLink}</p>","categories":{}}}},"Headline":{"types":{"Portfolios":{"html":"<p>Portfolios are divided into three areas: model, reference, and user generated portfolios.</p> The Syzygy Asset Management Model Portfolios apply a systematic asset allocation process to a diversified roster of liquid asset classes, as represented by common industry benchmark indices. Our model portfolios use a robust, adaptive, and disciplined approach that is informed by decades of research and experience. The resulting allocations offer a starting point for well-crafted strategic positioning in client portfolios.</p><p>Reference portfolios represent a set of commonly referenced portfolios such as 60/40 and Global Market Cap, with the constituent weights determined by various studies augmented to fit the investment universe we consider. <p>Each portfolio also includes a return due to diversification which captures the fact that a combined group of assets will have a higher annualized return than the weighted average return of its constituents.</p><p>Create your portfolio to view the return we would expect you to receive given your allocations.</p><p>Learn more about our portfolio methodology {methodologyDocHereLink}.</p>","categories":{"Efficient":{"html":"<p>Efficient portfolios are meant to show the maximum return that can be obtained for a given level of risk.  These portfolios represent the maximum return that can be obtained for a given level of risk.  These portfolios are constructed by considering the variability in the expected returns of each asset, through a monte carlo process, as well as employ a set of rules to generate diversified portfolios.</p><p>Diversification Maximum Weights:</p><ul class='default'><li>Equities: 80%</li><li>Commodities: 25%</li><li>Core Bonds: 60%</li><li>Credit: 30%</li><li>EM Bonds: 20%</li><li>EM Cash: 10%</li><li>Linkers: 20%</li><li>Real Estate (Private): 15%</li><li>REITS: 25%</li><li>Hedge Funds & PE: 10%</li></ul><p>It is possible to create a portfolio with a higher return than these portfolios, but that portfolio is most likely heavily concentrated in certain assets.</p><p>Learn more about our portfolio methodology {methodologyDocHereLink}.</p>"}}},"Public Equity":{"html":"<p>Equity expected returns are based on the Gordon Growth Model which focuses on dividend yield and price appreciation earned from a growth in cash flows such that yield remains constant over time.  This return perspective can be seen by switching the 'Model' to Yield + Growth.</p><p>As a default, our return model is valuation aware and also includes modeling of time varying discount rates based on the CAPE ratio measuring prices versus 10-year average real earnings.  The level of the CAPE when compared to fair value, or in our case a blended historical average across countries, can inform if markets are overvalued, fair valued or undervalued.</p><p>Learn more about our methodology for valuing assets {methodologyDocHereLink}.</p>","categories":{}},"Core Bonds":{"html":"<p>Core bonds represent investment in sovereign and corporate/government aggregate fixed income indices.</p><p>Ignoring credit events, the return of high grade government bonds, if held to maturity, is equal to the yield of the investment at purchase.</p><p>However in modeling long-term return, we do not consider these as buy and hold investments, but instead assume an annual rebalance period. For example, a 5-year bond is purchased on day 0, held for 1 year and then sold as a 4-year bond in order to repurchase a bond with a 5-year exposure.  This allows us to capture investment in any maturity bond over a 10-year investment horizon.</p><p>In addition, many bonds d structure":{"html":"<p>The Commercial Real Estate asset class represents investment in commercial buildings such as apartments, industrial locations, offices and retail shopping venues.</p><p>Two main avenues for gaining exposure to commercial real estate are through exchange traded vehicles such as Real Estate Investment Trusts (REITs) or by purchasing direct interest in the buildings themselves.  This is distinct from investing in private real estate funds as fees charged by the fund are not considered here.</p><p>In addition the prices of commercial builders are often based on appraised values which are heavily autocorrelated, thus underestimating volatility.  We attempt to display more realistic levels of volatility by removing autocorrelation in those returns.</p><p>The methodology for investing in REITs is based on a leveraged approach to investing in the property directly, including the fact that REITs can trade at a premium or discount to NAV.</p><p>Learn more about our real estate methodology <a href='{coreSiteBaseUrl}/publications/articles/564_next_seasons_meager_harvest_in_commercial_real_estate' target='_blank' rel='noreferrer'>here</a>. </p>","categories":{}},"Hedge Funds":{"html":"<p>Hedge funds differ from our modeling of other asset classes in two primary ways.</p><ul><li>They are not passive asset classes, but rather active strategies in which changing portfolio holdings must be considered</li><li>Unlike other asset classes, the commonly available hedge fund indices are not good proxies as they suffer from issues including survivorship bias and self-reporting bias.</li></ul><p>Our approach to modeling <i>gross of fee</i> hedge fund strategies is to construct strategies from individual securities based on the trading behavior of the various types of fund managers.  These strategies are meant to represent an average strategy in each category with the understanding that actual hedge fund managers, gross of fees, could do far better or worse than this average based on his or her skill.</p><p>The written methodology for hedge funds is forthcoming</p>","categories":{}},"Private Equity":{"html":"<p>Aggregate data on private companies is difficult to obtain, and usually must be built from individual transactions involving private firms.</p><p>As we work on constructing <i>gross of fee</i> long-term expected returns for additional sets of private companies, we start by delivering returns for companies taken private in leveraged buyouts and then put back into the public markets after some time, as well as for small companies targeted by middle stage venture capitalists.</p><p>The LBO and VC returns shown here are based on returns obtained by following investment rules of many private equity funds which sell companies after they reach a high hurdle of return or simply write-off companies at zero if they cross a lower threshold of return.</p><p>The volatility of private equity can often be understated due to appraisal based pricing; however, here we remove autocorrelation in returns and attempt to show volatility levels consistent with academic and practitioner research in this area.</p><p>The written methodology for private equity is forthcoming with the additional strategies.</p>","categories":{}},"Style Equity":{"html":"<p>Equity style expected returns are constructed as expected excess returns added to the expected return of the core portfolio.  For example, the expected return of U.S. Large Value is the expected return of the U.S. Large asset plus the excess return contributed by the value tilt of this asset.  The Yield, Growth and Valuation components of return will be the same between the style index and the underlying core index, while the style index will have additional alpha components displayed which represent the expected excess return.</p><p>The expected excess return is further decomposed into two components, structural alpha an revaluation alpha.  Expected structural alpha is based on the construction of the style index, regardless of current fundamentals, while the revaluation component is positive when the style index appears cheaper than its core benchmark, and negative when it appears more expensive.</p><p>Learn more about our methodology for valuing assets {methodologyDocHereLink}</p>","categories":{}}}},"BoxPlot":{"Real GDP Growth":"Expected average annualized real GDP growth in 10 years for {name}, compared to history.","Global Inflation":"Expected average annualized inflation over the next 10 years for {name}, compared to history.","Equity Market CAPE":"Expected Cyclically Adjusted Price-to-Earnings (CAPE) ratio in 10 years for {name}, compared to history.","Government T-Bills":"Expected 3M government yields in 10 years for {name}, compared to history.","Government Nominal Yield":"Expected 10Y nominal government yields in 10 years for {name}, compared to history.","Government Real Yield":"Expected 10Y real government yields in 10 years for {name}, compared to history.","Government Slope":"Expected government yield curve slope (10-yr yield minus 3-mo yield) for {name}, in 10 years, compared to history.","Credit Spread":"Expectation of 5-year {name} credit spreads, compared to history."}},"assets":{"portfolio_ramp_conservative":"Syzygy Asset Management's Conservative model is designed to deliver long-term outperformance vs. a global 40 / 60  portfolio. The portfolio is built with a robust, adaptive, and disciplined asset allocation process applied across a diverse roster of liquid asset classes. Equity assets are represented by cap-weighted indices.","portfolio_ramp_moderate":"Syzygy Asset Management's Moderate model is designed to deliver long-term outperformance vs. a global 60 / 40  portfolio. The portfolio is built with a robust, adaptive, and disciplined asset allocation process applied across a diverse roster of liquid asset classes. Equity assets are represented by cap-weighted indices.","portfolio_ramp_aggressive":"Syzygy Asset Management's Aggressive model is designed to deliver long-term outperformance vs. a global 80 / 20  portfolio. The portfolio is built with a robust, adaptive, and disciplined asset allocation process applied across a diverse roster of liquid asset classes. Equity assets are represented by cap-weighted indices.","portfolio_ramp_equity":"Syzygy Asset Management's All Equity model is designed to deliver long-term outperformance vs. a global 100 / 0  portfolio. The portfolio is built with a robust, adaptive, and disciplined asset allocation process applied across a diverse roster of liquid asset classes. Equity assets are represented by cap-weighted indices.","portfolio_advisor_average":"Portfolio represents the average asset allocation of many financial advisors.  The portfolio is heavily invested in US stocks and bonds with smaller allocations across a number of other higher expected return asset classes.","portfolio_diversifiers":"Portfolio represents equal weighted exposure across 16 asset classes which provide diversification to standard stock and bond portfolios.  In some cases the exposure to an asset category is split across multiple assets for additional granularity  or a single asset when granularity is not available.","portfolio_equal_weight":"Portfolio represents equal weighted exposure across 10 high level asset classes.  In some cases the exposure to an asset category is split across multiple assets for additional granularity or a single asset when granularity is not available.","portfolio_sixty_forty":"Portfolio represents the standard 60% local market large cap equity portfolio combined with 40% local market bond exposure, either in aggregate or sovereign form.","portfolio_long_term_liabilities":"Portfolio constituents are meant to represent the future spending requirements to meet a set of liabilities of long duration.  This portfolio is a combination of long-term sovereign debt and shorter-term aggregate type exposure.","portfolio_ramp_conservative_bench":"Portfolio represents ls described {methodologyDocHereLink}.","equity_us_small_2000":"The <b>US Small</b> asset class represents a passive cap-weighted portfolio of 2000 small US company equity securities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_us_small_2000_growth":"The <b>US Small Growth</b> asset class represents a passive cap-weighted portfolio of 2000 small growth US company equity securities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_us_small_2000_value":"The <b>US Small Value</b> asset class represents a passive cap-weighted portfolio of 2000 small value US company equity securities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_brazil":"The <b>Brazil</b> asset class represents a passive cap-weighted portfolio of large Brazilian equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_china":"The <b>China</b> asset class represents a passive cap-weighted portfolio of large Chinese equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_india":"The <b>India</b> asset class represents a passive cap-weighted portfolio of large Indian equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_indonesia":"The <b>Indonesia</b> asset class represents a passive cap-weighted portfolio of large Indonesian equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_malaysia":"The <b>Malaysia</b> asset class represents a passive cap-weighted portfolio of large Malaysian equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_mexico":"The <b>Mexico< ribed {methodologyDocHereLink}.","equity_czech_republic":"The <b>Czech Republic</b> asset class represents a passive cap-weighted portfolio of large Czech Republican equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_egypt":"The <b>Egypt</b> asset class represents a passive cap-weighted portfolio of large Egyptian equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_hungary":"The <b>Hungary</b> asset class represents a passive cap-weighted portfolio of large Hungarian equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_israel":"The <b>Israel</b> asset class represents a passive cap-weighted portfolio of large Israeli equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_peru":"The <b>Peru</b> asset class represents a passive cap-weighted portfolio of large Peruvian equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_philippines":"The <b>Philippines</b> asset class represents a passive cap-weighted portfolio of large Philippian equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_austria":"The <b>Austria</b> asset class represents a passive cap-weighted portfolio of large Austrian equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_belgium":"The <b>Belgium</b> asset class represents a passive cap-weighted portfolio of large Belgian equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_denmark":"The <b>Denmark</b> asset class represents a passive cap-weighted portfolio of large Danish equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_finland":"The <b>Finland</b> asset class represents a passive cap-weighted portfolio of large Finnish equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_ireland":"The <b>Ireland</b> asset class represents a passive cap-weighted portfolio of large Irish equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_portugal":"The <b>Portugal</b> asset class represents a passive cap-weighted portfolio of large Portuguese equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_singapore":"The <b>Singapore</b> asset class represents a passive cap-weighted portfolio of large Singaporean equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_new_zealand":"The <b>New Zealand</b> asset class represents a passive cap-weighted portfolio of large New Zealand equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_norway":"The <b>Norway</b> asset class represents a passive cap-weighted portfolio of large Norwegian equities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","pe_us_lbo":"The <b>US Leveraged Buyout</b> strategy is derived from a set of Syzygy Asset Management rules constructed to mimic a representative example of leveraged buyout investment rules and exposures.  All risk and return values are presented gross of any fees. All risk and return values are presented gross of any fees. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","pe_us_venture_capital":"The <b>US Venture Capital</b> strategy is derived from a set of Syzygy Asset Management rules constructed to mimic a representative example of venture capital investment rules and exposures.  All risk and return values are presented gross of any fees. All risk and return values are presented gross of any fees. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","hf_us_long_short_equity":"The <b>US Long/Short Equity</b> strategy is derived from a set of Syzygy Asset Management rules constructed to mimic a representative example of long/short hedge fund trading rules and exposures.  All risk and return values are presented gross of any fees. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","reit_global_index":"The <b>Global REIT</b> asset class represents a global diversified portfolio of real estate investment trusts covering companies focused in sectors such as data centers, industrial, offices, residential and retail facilities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","reit_equity_index":"The <b>REIT</b> asset class represents a US diversified portfolio of real estate investment trusts covering companies focused in sectors such as data centers, industrial, offices, residential and retail facilities. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","mlp":"The <b>MLP</b> asset class represents a diversified portfolio of master limited partnerships covering companies in sectors such as real estate and natural resources. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_dm_ex_us_rafi":"The <b>RAFI Fundamental Index</b> selects and weights companies according to four fundamental measures of company size: book value, cash flow, dividends + buybacks, and adjusted sales. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_dm_ex_us_small_rafi":"The <b>RAFI Fundamental Index Small</b> simulation selects stocks between the 86th and 98th percentile by cumulative fundamentals (book value, cash flow, dividends + buybacks, and adjusted sales) and weights by fundamentals. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_dm_world_rafi":"The <b>RAFI Fundamental Index</b> selects and weights companies according to four fundamental measures of company size: book value, cash flow, dividends + buybacks, and adjusted sales. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_dm_world_small_rafi":"The <b>RAFI Fundamental Index Small</b> simulation selects stocks between the 86th and 98th percentile by cumulative fundamentals (book value, cash flow, dividends + buybacks, and adjusted sales) and weights by fundamentals. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_em_rafi":"The <b>RAFI Fundamental Index</b> selects and weights companies according to four fundamental measures of company size: book value, cash flow, dividends + buybacks, and adjusted sales. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_us_large_rafi":"The <b>RAFI Fundamental Index</b> selects and weights companies according to four fundamental measures of company size: book value, cash flow, dividends + buybacks, and adjusted sales. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}.","equity_us_small_rafi":"The <b>RAFI Fundamental Index Small</b> simulation selects stocks between the 86th and 98th percentile by cumulative fundamentals (book value, cash flow, dividends + buybacks, and adjusted sales) and weights by fundamentals. Expected risk and return metrics are derived using proprietary models described {methodologyDocHereLink}."}},"chartDescriptions":{},"informationText":{"settings":{"terms":"The real nominal setting affects if the displayed values, unless otherwise indicated in the chart name, are net of inflation (real) or include inflation (nominal).","currency":"Unless otherwise specified, all values are converted to the selected currency.","models":"<p>The model setting determines the expected return model which is used throughout the charts. The Valuation Dependent model includes reversion toward the mean based on the expectation of changes in valuation metrics.  The Yield + Growth model assumes valuations do not change in the future.</p><p></p><p>These models can be used independently or blended together to create a new model. For example (50% Valuation Dependent and 50% Yield + Growth) blends the expected return values for each asset at a 50/50 mix of the returns determined under each individual model.</p>","scale":"Setting will change the y-axis of all line charts and box plots to either be logarithmic (power of 2) or linear.  A log axis is setup such that equal distance exists between values representing the same growth rate, whereas a linear axis shows an equal arithmetic difference between the axis values."},"detail":{"Returns":"Learn more about our methodology {methodologyDocHereLink}.","Cumulative Probability":"Expected returns as shown in the scatter plot are not intended as point estimates but instead represent the mean of a distribution.  Viewing this distribution from a left cumulative perspective shows the probability of achieving different levels of real return.  Lower returns have a higher probability of being eclipsed, and higher returns have a lower probability.","Sharpe Ratio":"The Sharpe ratio is calculated as the excess return over cash divided by the volatility of the asset. Trailing Sharpe Ratios are calculated using annualized returns and annualized risk based on monthly observation. YTD values represent trailing 12-month estimates.","Information Ratio":"The Information Ratio quantifies the amount of return in excess of a benchmark per unit of tracking error. Historical Sharpe Ratios are calculated using annualized returns and annualized risk based on monthly observations.  YTD values represent trailing 12-month estimates.  This value is dynamic based on the selected benchmark.","Probability of 5% Real Return":"Represents the probability the expected return net of inflation is greater than 5%, a target for many institutional investors."},"charts":{"mode":{"Headline":{"returns-vs-risk-scatter":"<p>Shows return vs. risk for assets and portfolios.</p><p>The dropdowns in the chart allow you to select expected and trailing returns for your desired time horizon. If you select YTD, return is YTD and volatility is shown using the most recent 12 months of returns.</p><p>Learn more about our methodology {methodologyDocHereLink}.</p>"},"All":{"returns-vs-risk-scatter":"<p>Shows return vs. risk for assets and portfolios.</p><p>The dropdowns in the chart allow you to select expected and trailing returns for your desired time horizon. If you select YTD, return is YTD and volatility is shown using the most recent 12 months of returns.</p><p>Learn more about our methodology {methodologyDocHereLink}.</p>"}},"cape-ratio-box":"<p>Expected Cyclically Adjusted Price-to-Earnings (CAPE) ratio in 10 years, compared to history.</p><p>Also known as the Shiller P/E, the CAPE ratio is the price of a stock divided by an average of its 10-yr earnings, all adjusted for inflation. The objective of the CAPE is to provide a measure of price to earnings that is independent of short-term fluctuations in the business cycle.</p><p>Learn more about our methodology {methodologyDocHereLink}.</p><p class='source'>Sources: Syzygy Asset Management, Bloomberg, MSCI</p>","cape-ratio-line":"<p>Also known as the Shiller P/E, the CAPE ratio is the price of a stock divided by an average of its 10-yr earnings, all adjusted for inflation. The objective of the CAPE is to provide a measure of price to earnings that is independent of short-term fluctuations in the business cycle.</p><p>Learn more about our methodology {methodologyDocHereLink}.</p><p class='source'>Sources: Syzygy Asset Management, Bloomberg, MSCI</p>","commodity-carry-box":"<p>Shows the expected annualized slope of the commodity term structure over the next 10-years.  For non-seasonal commodities, this is the difference between adjacent contracts whereas for seasonal commodities the difference is between contracts 12-months apart.</p>","commodity-carry-dot":"<p>Shows the expected annualized slope of the commodity term structure over the next 10-years.  For non-seasonal commodities, this is the difference between adjacent contracts whereas for seasonal commodities the difference is between contracts 12-months apart.</p>","credit-nominal-yield-box":"<p>Expected 10Y nominal credit yields in 10 years, compared to history.</p><p>Learn more about our methodology {methodologyDocHereLink}.</p><p class='source'>Sources: Syzygy Asset Management, Bloomberg</p>","credit-slope-box":"<p>Expected credit yield curve slope (10-yr yield minus 3-mo yield), in 10 years, compared to history.</p><p>Learn more about our methodology {methodologyDocHereLink}.</p><p class='source'>Sources: Syzygy Asset Management, Bloomberg</p>","credit-slope-line":"<p>Shows the slope of the credit yield curve, defined as the 10-yr yield minus the 3-mo yield.</p><p>Learn more about our methodology {methodologyDocHereLink}.</p><p class='source'>Sources: Syzygy Asset Management, Bloomberg</p>","credit-spread-box":"<p>History of Investment Grade and High Yield credit spreads over maturity matched government securities. Investment grade spread is AA rated, and High Yield is BB rated. The spread maturity is 5 years.</p>","expected-correlations-matrix":"<p style='background:#ffffff;padding-left:8px'><img src=\"{publicPath}images/correlation-matrix.svg\" alt=\"Correlation Matrix Legend\"></p><p>Provides a graphical view (heat map) of the pairwise correlations between assets. Expectations of correlation are based on an exponentially weighted moving average of trailing returns with a 10-yr half-life.</p><p class='source'>Sources: Syzygy Asset Management, Bloomberg, MSCI, NCREIF, CRSP</p>","global-inflation-box":"<p>Expected average annualized inflation over the next 10 years, compared to history.</p><p>Learn more about our Inflation methodology {methodologyDocHereLink}.</p><p class='source'>Sources: Syzygy Asset Management, Bloomberg</p>","govt-nominal-yield-box":"<p>Expected 10Y nominal government yields in 10 years, compared to history.</p><p>Learn more about our methodology {methodologyDocHereLink}.</p><p class='source'>Sources: Syzygy Asset Management, Bloomberg</p>","govt-slope-box":"<p>Expected government yield curve slope (10-yr yield minus 3-mo yield), in 10 years, compared to history.</p><p>Learn more about our methodology {methodologyDocHereLink}.</p><p class='source'>Sources: Syzygy Asset Management, Bloomberg</p>","govt-slope-line":"<p>Shows the slope of the government yield curve (10-yr yield minus 3-mo yield), long studied as a predictor of economic recessions. Campbell Harvey was the first to study the implications of yield-curve slope in his 1986 PhD thesis. He explored the concept that the term structure of interest rates (difference between long-term and short-term rates) could predict the US business cycle.</p><p>Learn more about our methodology {methodologyDocHereLink}.</p><p class='source'>Sources: Syzygy Asset Management, Bloomberg</p>","govt-t-bills-box":"<p>Expected 3M government yields in 10 years, compared to history.</p><p>Current real cash rates are calculated using current nominal cash rates minus year-over-year headline inflation as a proxy for three month break even rates.</p><p>Learn more about our cash-rate forecasting methodology {methodologyDocHereLink}.</p><p class='source'>Sources: Syzygy Asset Management, Bloomberg</p>","govt-t-bills-dot":"<p>Shows a comparison of the current 3M government yield (i.e. cash rate) to the expected 3M government yield in 10 years. Cash rates are shown in either real or nominal terms, depending on the setting you select.</p><p>Current real cash rates are calculated using current nominal cash rates minus year-over-year headline inflation as a proxy for three month break even rates.</p><p>Learn more about our cash-rate forecasting methodology {methodologyDocHereLink}.</p><p class='source'>Sources: Syzygy Asset Management, Bloomberg</p>","portfolios-allocations-stacked":"<p>Shows portfolio allocations to asset categories. For detailed holdings, click on the portfolio and view the Portfolio Details tab.</p>","portfolios-performance-line":"<p>Shows the growth from investing 100 units of currency in each portfolio. The chart is calculated by taking the starting amount of 100 and compounding it using the monthly return of each asset over time.</p>","cre-cap-rates-box":"<p>The Cap Rate is calculated as net operating income excluding capital expenditures, divided by property value.</p><p class='source'>Sources: Syzygy Asset Management, LLC, NCREIF</p>","cre-cap-rates-dot":"<p>The Cap Rate is calculated as net operating income excluding capital expenditures, divided by property value.</p><p class='source'>Sources: Syzygy Asset Management, LLC, NCREIF</p>","real-estate-return":"<p>Commercial real estate expected returns for major segments in the U.S. Across regions, apartments, industrial locations, offices and retail buildings are valued based on the current cap rate of average buildings in each area and a set of other income and price appreciation metrics.</p><p>Learn more about our real estate methodology <a href='{coreSiteBaseUrl}/about-us/our-team/cam-harvey' target='_blank' rel='noreferrer'>here</a>.</p><p class='source'>Sources: Syzygy Asset Management, NCREIF</p>","real-gdp-growth-box":"<p>Expected average annualized real GDP growth in 10 years, compared to history.</p><p>Learn more about our GDP methodology {methodologyDocHereLink}. </p><p class='source'>Sources: Syzygy Asset Management, Bloomberg</p>","govt-real-yield-box":"<p>Expected 10Y real government yields in 10 years, compared to history.</p><p>Learn more about our fixed income forecasting methodology {methodologyDocHereLink}.</p><p class='source'>Sources: Syzygy Asset Management, Bloomberg</p>","returns-vs-duration-scatter":"<p>Shows the relationship between the duration of fixed income asset classes and their expected return.</p><p class='source'>Sources: Syzygy Asset Management, Bloomberg</p>","returns-column":"Shows the sorted cross-section of returns.","sharpe-ratio-column":"<p>Shows the sorter cross-section of Sharpe Ratio where the Sharpe ratio is calculated as the excess return vs. cash, divided by volatility.</p><p class='source'>Sources: Syzygy Asset Management, Bloomberg, MSCI, NCREIF, CRSP</p>","volatility-dot":"<p>Shows the comparison of trailing volatility, calculated using the standard deviation of monthly observations, to expected volatility.  Expected volatility is calculated using an exponentially weighted moving average of trailing returns with a 10-yr half-life.</p><p class='source'>Sources: Syzygy Asset Management, Bloomberg, MSCI, NCREIF, CRSP</p>","strategy-relative-valuation-box":"<p></p>"}},"chartDisclaimers":{"all":"Note: This interactive tool generates outcomes that are hypothetical in nature and does not recommend securities. Results may vary with each use and over time. The performance information presented represents simulated performance. <b>Past simulated performance is no guarantee of future performance and does not represent actual performance of an investment product; actual investment results will differ.</b>","portfolios-performance-line":"The simulated performance of the models shown is calculated using indexes only and does not reflect the performance of any actual investment product. <b>Past simulated performance is no guarantee of future performance; actual investment results will differ.</b> Please see <a href='{coreSiteBaseUrl}/legal/terms-of-use#aai' target='_blank' rel='noreferrer'>{coreSiteBaseUrl}/legal/terms-of-use#aai</a> for important information regarding hypothetical performance and your use of this website."},"modelProRataText":"Similar to allocations to other assets, by default any allocations to reference portfolios are taken from uninvested cash. This means that adding an allocation to a model will reduce uninvested cash without affecting the allocations to any other assets. To facilitate easier blending of portfolios, reference portfolio allocations also support pro-rata. Switching to pro-rata, any <i>additional</i> allocations to model portfolios will cause a pro-rata deduction in the allocations of <i>all non-model portfolio assets</i> including uninvested cash.","printIntroPageText":[{"paragraphs":["Our Asset Allocation Interactive gives us an opportunity to describe the investment beliefs underlying our models, expected returns, and investment strategies. Though grounded in theory and supported by empirical examination, they are not scientific facts. We prefer the honest acceptance that we (and anyone else we've come across so far) do not have perfect knowledge or information. For those willing to join us and embrace the discomfort, our beliefs draw a clear course of action that has served us well in the past and should continue to serve us well in the future."]},{"heading1":"Central Investment Philosophy","heading2":"The largest and most persistent active investment opportunity is long-horizon mean reversion.","paragraphs":["Quite simply, systematically buying assets with relatively low prices (and correspondingly high yields) and having the conviction to hold these positions over potentially extended horizons allows investors to earn higher risk-adjusted returns, albeit at significant emotional cost. This central investment philosophy is the logical conclusion sitting atop three supporting beliefs."]},{"heading1":"Belief One","heading2":"Investor preferences are broader than risk and return.","paragraphs":["The human psyche is rich and complex in ways well beyond those captured in standard finance textbooks. Yes, investors may weigh potential returns against risk. However, our experience teaches us that investors' actions are also affected by the desired safety of following the herd and the corresponding fear of being an outsider; the pride and status derived from owning stocks of successful firms and avoiding association with assets that receive negative press; the allure of gambling and positively skewed distributions; the heightened aversion to losses relative to gains; and so forth. We readily acknowledge the validity of these preferences, rather than labeling them irrational."]},{"heading1":"Belief Two","heading2":"Prices vary around fair value.","paragraphs":["Because of the complex and time-varying preferences of investors, at any given point in time, all asset prices are not unbiased estimates of fair value. Instead, prices can, and do, materially deviate from reasonable and transparent estimates of intrinsic value, often for prolonged periods. Over longer periods, we expect prices to eventually revert toward estimates of intrinsic value, even as new errors in either direction are introduced. This mean-reverting process tilts the scale in favor of buying low and selling high, or at least buying low and selling at fair value!"]},{"heading1":"Belief Three","heading2":"Lack of conviction (and/or internal governance constraints) restrict/prohibit investors from exploiting long-term value.","paragraphs":["When push comes to shove, what kind of assets will choose, especially after their strategies have disappointed over a multi-year horizon? It is our belief that a lack of conviction in investment choices by most individuals, and the corresponding constraints on the institutions governed by such individuals, inhibit the successful exploitation of mispricings.","Therefore, great resolve—at least as much as skill or insight—is crucial in our ability to earn excess returns over time by buying assets with low prices/high yields and selling assets with high prices/low yields. This resolve allows us to stay the course and even rebalance into assets that continue to get cheaper."]}],"printDisclaimers":{"pageFooterParagraph":"As of {dataDate}. All data presented herein is provided for informational purposes only and may not be reproduced without the express written consent of Syzygy Asset Management, LLC (Syzygy). The data is sourced from Syzygy's Asset Allocation Interactive website, does not represent the past, current or future performance of any affiliated fund or strategy and may be based on estimates. The data and the resulting forecasts are forward-looking statements based upon the reasonable beliefs of Syzygy and are not a guarantee of future performance. Forward-looking statements speak only as of the date they are made and Syzygy assumes no duty to and does not undertake to update the information herein. Forward-looking statements are subject to numerous assumptions, risks, and uncertainties, which change over time. Actual results may differ materially from those presented herein. Please reference additional important disclosures at the end.","documentEndParagraphs":["The information and data contained herein is for informational purposes only and is not intended to provide, and should not be relied on for, accounting, legal, tax, or investment advice.  The information is not intended as an offer or solicitation for the purchase or sale of any security or financial instrument, nor is it advice or a recommendation to invest in any particular asset class, product, security, derivative, commodity, currency or strategy.  The Asset Allocation Interactive tool (“AAI”) generates outcomes that are hypothetical in nature and cannot determine which securities to buy or sell.  Results may vary with each use and over time. Information contained herein is subject to change at any time without notice.  Exclusive reliance on the data herein to make an investment decision is not advised.  Your use of this information does not create an investment advisory, fiduciary, or professional services relationship between you and Syzygy Asset Management, LLC (“Syzygy Asset Management”).","All data presented on AAI is based on simulated portfolio data computed by Syzygy Asset Management and, as such, no allowance has been made for trading or implementation costs, management fees, or other costs.  Asset class and strategy assumptions are passive only—they do not consider the impact of active management.  Past performance, including simulated performance, is no guarantee of future performance and does not represent actual performance of an investment product, as the information provided relates only to index data.  Indexes are unmanaged and cannot be invested in directly.  The data may have under- or over-compensated for the impact, if any, of certain market factors.  Simulated returns may not reflect the impact that material economic and market factors might have had on the advisor's decision-making if the advisor were actually managing clients' money.  Simulated data is subject to the fact that it is designed with the benefit of hindsight.  Simulated returns cannot predict how an investment strategy will perform in the future.  Simulated returns should not be considered indicative of the skill of the advisor. Investors may experience loss of all or some of their investment.  Actual investment results will differ.  All information and data are generally based on information and data from third party sources.","The information contained within AAI may or may not represent real return forecasts for several asset classes and not for any Syzygy Asset Management fund or strategy.  These forecasts are forward-looking statem petitive strengths to endure adverse economic conditions.","Bond prices fluctuate inversely to changes in interest rates. Therefore, a general rise in interest rates can result in the decline of the value of your investment. High-yield bonds, also known as junk bonds, are subject to greater risk of loss of principal and interest, including default risk, than higher-rated bonds. Investing in fixed-income securities involves certain risks such as market risk if sold prior to maturity and credit risk especially if investing in high-yield bonds which have lower ratings and are subject to greater volatility. All fixed-income investments may be worth less than original cost upon redemption or maturity.","{pagebreak}","There are special risks associated with investments in real estate, including credit risk, interest-rate fluctuations and the impact of varied economic conditions. Distributions from REIT investments are taxed at the owner's tax bracket.","Hedge funds or alternative investments are complex, speculative investment vehicles and are not suitable for all investors. They are generally open to qualified investors only and carry high costs and substantial risks and may be highly volatile. There is often limited (or even nonexistent) liquidity and a lack of transparency regarding the underlying assets. They do not represent a complete investment program. The investment returns may fluctuate and are subject to market volatility so that an investor's shares, when redeemed or sold, may be worth more or less than their original cost. Hedge funds are not required to provide investors with periodic pricing or valuation and are not subject to the same regulatory requirements as mutual funds. Investing in hedge funds may also involve tax consequences. Speak to your tax advisor before investing. Investors in funds of hedge funds will incur asset-based fees and expenses at the fund level and indirect fees, expenses and asset-based compensation of investment funds in which the
